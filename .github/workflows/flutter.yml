name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name nghma .

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          flutter build apk --release || true

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Flutter did not expose the APK at its usual path. Building directly with Gradle..."
            cd android
            ./gradlew :app:assembleRelease --stacktrace
            cd ..

            GRADLE_APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"
            if [ -z "$GRADLE_APK" ]; then
              echo "No release APK was produced by Gradle. Searching all build outputs..."
              find . -type f -name '*.apk' -print
              exit 1
            fi

            mkdir -p build/app/outputs/flutter-apk
            cp "$GRADLE_APK" "$APK_PATH"
          fi

          ls -lh "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nghma-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
