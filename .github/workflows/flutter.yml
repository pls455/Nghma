name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        shell: bash
        run: |
          set -e
          mkdir -p build/app/outputs/flutter-apk
          if flutter build apk --release; then
            echo "Flutter APK build completed successfully."
          else
            echo "Flutter reported a build-output lookup failure. Searching for the generated APK..."
            APK_PATH="$(find . -type f -name 'app-release.apk' -print -quit)"
            if [ -z "$APK_PATH" ]; then
              echo "No app-release.apk was generated."
              exit 1
            fi
            echo "Found generated APK at: $APK_PATH"
            cp "$APK_PATH" build/app/outputs/flutter-apk/app-release.apk
          fi
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nghma-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
